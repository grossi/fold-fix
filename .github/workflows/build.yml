name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Build with exactly the SDK installed below (build.sh would otherwise pick the newest one the
  # runner image happens to have).
  BUILD_TOOLS_VERSION: "35.0.0"
  ANDROID_PLATFORM: "android-35"

jobs:
  # Branches, pull requests and manual runs. Always signed with a throwaway debug key: the
  # release key is never exposed to these builds.
  build:
    name: Build APK (debug key)
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: "platform-tools platforms;${{ env.ANDROID_PLATFORM }} build-tools;${{ env.BUILD_TOOLS_VERSION }}"

      - name: Build
        run: |
          bash ./build.sh
          (cd build && sha256sum fold-fix.apk | tee fold-fix.apk.sha256)

      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fold-fix-apk
          path: |
            build/fold-fix.apk
            build/fold-fix.apk.sha256
          if-no-files-found: error

  # Tags v*: build with the release key and publish a GitHub Release.
  #
  # Users can only update over an earlier install if every release is signed with the same key.
  # Signing secrets:
  #   KEYSTORE_BASE64  base64 of the .jks/.keystore file
  #   KEYSTORE_PASS    keystore password
  #   KEY_ALIAS        key alias inside the keystore
  #   KEY_PASS         key password (optional, defaults to KEYSTORE_PASS)
  # Store them as secrets of the "release" environment (Settings > Environments), which lets you
  # restrict them to v* tags and require an approval. That's optional: GitHub creates the
  # environment on first use, and plain repository secrets work too.
  release:
    name: Build and publish release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check that the tag matches versionName
        run: |
          version="$(sed -n 's/.*android:versionName="\([^"]*\)".*/\1/p' app/AndroidManifest.xml | head -n 1)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match versionName \"$version\" in app/AndroidManifest.xml (expected tag v$version). Bump versionName and versionCode first."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: "platform-tools platforms;${{ env.ANDROID_PLATFORM }} build-tools;${{ env.BUILD_TOOLS_VERSION }}"

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASS" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::Release builds need a stable signing key: set KEYSTORE_BASE64, KEYSTORE_PASS and KEY_ALIAS (see the comment above this job)."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: Build
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: KEYSTORE="$RUNNER_TEMP/release.keystore" bash ./build.sh

      - name: Remove decoded key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Print signing certificate and checksum
        run: |
          "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/$BUILD_TOOLS_VERSION/apksigner" verify --print-certs build/fold-fix.apk | grep -E "DN:|SHA-256"
          (cd build && sha256sum fold-fix.apk | tee fold-fix.apk.sha256)

      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fold-fix-apk
          path: |
            build/fold-fix.apk
            build/fold-fix.apk.sha256
          if-no-files-found: error

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            build/fold-fix.apk
            build/fold-fix.apk.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
